services:
  mysql:
    image: mysql:8.4
    hostname: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dyo}
      MYSQL_USER: ${MYSQL_USER:-dyo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dyo_pass}
    ports:
      - target: 3306
        published: 3306
        protocol: tcp
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: unless-stopped
        delay: 5s
        max_attempts: 3
        window: 120s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: devid11/devid-porto-backend:latest
    hostname: backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-dyo}:${MYSQL_PASSWORD:-dyo_pass}@mysql:3306/${MYSQL_DATABASE:-dyo}
      JWT_SECRET: ${JWT_SECRET:-devid-porto-jwt-secret-key-2024}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - backend
      - frontend
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: unless-stopped
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: devid11/devid-porto-frontend:latest
    hostname: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - target: 80
        published: 80
        protocol: tcp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: unless-stopped
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  backend:
    attachable: true
  frontend:
    attachable: true
